<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Student Registration</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#1e3c72,#2a5298);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    background:white;
    width:100%;
    max-width:700px;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

h1{
    text-align:center;
    color:#2a5298;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:12px;
    font-weight:bold;
}

input,select,textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#2a5298;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1e3c72;
}

.success{
    color:green;
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

.error{
    color:red;
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="container">

<h1>Student Registration Form</h1>

<form id="regForm">

<label>Full Name</label>
<input type="text" id="name" required>

<label>Email</label>
<input type="email" id="email" required>

<label>Mobile Number</label>
<input type="tel" id="mobile" pattern="[0-9]{10}" required>

<label>Date of Birth</label>
<input type="date" id="dob" required>

<label>Age</label>
<input type="number" id="age" readonly>

<label>Gender</label>
<select id="gender" required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<label>Course</label>
<select id="course" required>
<option value="">Select Course</option>
<option>B.Tech</option>
<option>BCA</option>
<option>MCA</option>
<option>M.Tech</option>
</select>

<label>Address</label>
<textarea id="address" rows="4" required></textarea>

<button type="submit">Register</button>

<div id="message"></div>

</form>

</div>

<script>

const dob = document.getElementById("dob");
const age = document.getElementById("age");

dob.addEventListener("change", function(){

let birthDate = new Date(this.value);
let today = new Date();

let calculatedAge =
today.getFullYear() - birthDate.getFullYear();

let monthDiff =
today.getMonth() - birthDate.getMonth();

if(monthDiff < 0 ||
(monthDiff === 0 &&
today.getDate() < birthDate.getDate()))
{
    calculatedAge--;
}

age.value = calculatedAge;
});

document.getElementById("regForm")
.addEventListener("submit", function(e){

e.preventDefault();

let ageValue = parseInt(age.value);

if(ageValue < 18 || ageValue > 60)
{
    document.getElementById("message").innerHTML =
    "<div class='error'>Age must be between 18 and 60 years.</div>";
    return;
}

document.getElementById("message").innerHTML =
"<div class='success'>Registration Successful ✅</div>";

this.reset();
age.value = "";

});

</script>

</body>
</html>
